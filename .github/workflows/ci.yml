name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: Build shared
        run: npm run build -w @genki/shared
      - name: Typecheck
        run: npm run typecheck
      - name: dependency-cruiser
        run: npm run depcruise
      - name: Tests
        run: npm test
      - name: Protocol tests
        run: npm run test:protocol
      - name: Build web
        run: npm run build -w @genki/web
      - name: Journal gate (server/web/shared)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)"
            HEAD="$(git rev-parse HEAD)"
          else
            BASE="${{ github.event.before }}"
            HEAD="$(git rev-parse HEAD)"
          fi
          node scripts/journal-gate.mjs --base "$BASE" --head "$HEAD"
