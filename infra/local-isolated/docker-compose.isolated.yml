# Isolated Genki MVP engines — unique project/network/volumes/ports. Loopback only.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: genki_hospital
      POSTGRES_USER: genki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:55433:5432'
    volumes:
      - genki_mvp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U genki -d genki_hospital']
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: genki_test_pediatrico
      MYSQL_USER: genki
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:33306:3306'
    volumes:
      - genki_mvp_mysqldata:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:7
    environment:
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:37017:27017'
    volumes:
      - ./mongodb/start-rs.sh:/start-rs.sh:ro
      - genki_mvp_mongodata:/data/db
      - genki_mvp_mongoconfig:/data/configdb
    entrypoint: ['bash', '/start-rs.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh -u root -p "$$MONGO_ROOT_PASSWORD" --authenticationDatabase admin --quiet --eval "db.hello().isWritablePrimary === true"',
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 40s

volumes:
  genki_mvp_pgdata:
  genki_mvp_mysqldata:
  genki_mvp_mongodata:
  genki_mvp_mongoconfig:
