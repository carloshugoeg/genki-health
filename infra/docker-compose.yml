# Local engines for Entrega II. Carlos owns this file + CI wiring.
# Firebase uses the emulator under infra/firebase/ (not Compose).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: genki_hospital
      POSTGRES_USER: genki
      POSTGRES_PASSWORD: genki_dev_only
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U genki -d genki_hospital']
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: genki_pediatrico
      MYSQL_USER: genki
      MYSQL_PASSWORD: genki_dev_only
      MYSQL_ROOT_PASSWORD: genki_root_dev_only
    ports:
      - '3306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-ugenki', '-pgenki_dev_only']
      interval: 5s
      timeout: 5s
      retries: 15

  mongodb:
    image: mongo:7
    ports:
      - '27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
